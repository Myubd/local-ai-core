[project]
name = "local-ai-core"
version = "0.2.0"
description = "プライバシーファースト・ローカルAIエコシステムの共通コア層(LLM抽象化・共通データスキーマ・デバイス内ID管理・メモリー/ドキュメント/オートメーション/アシスタント)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
# local_ai_core.api (共通HTTPルーター)を使うアプリ/gatewayのみ必要
api = ["fastapi>=0.110", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_ai_core*"]
